<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ get_url(path="main.css") }}">
</head>
<body>
    <div class="stars-container">
        <div id="stars"></div>
        <div id="stars2"></div>
        <div id="stars3"></div>
    </div>

    <header>
        <nav>
            <a href="{{ get_url(path="@/_index.md") }}" class="logo">NORBU.DEV</a>
            <div class="links">
                <a href="{{ get_url(path="@/_index.md") }}">Home</a>
                <a href="https://github.com/norbu35">GitHub</a>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock content %}
    </main>

    <footer>
        <p>&copy; {{ now() | date(format="%Y") }} {{ config.extra.author | default(value="Norbu") }} • Built with Zola & Rust 🦀</p>
    </footer>

    <script>
        // Konami Code Easter Egg - Robust Edition
        const konamiCode = ['arrowup', 'arrowup', 'arrowdown', 'arrowdown', 'arrowleft', 'arrowright', 'arrowleft', 'arrowright', 'b', 'a'];
        let cursor = 0;

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            
            if (key === konamiCode[cursor]) {
                cursor++;
                console.log(`Konami Sequence: ${cursor}/${konamiCode.length}`);
                if (cursor === konamiCode.length) {
                    document.body.classList.toggle('konami-mode');
                    console.log('CHEAT CODE ACTIVATED: SUPER MODE');
                    cursor = 0;
                    // Only alert if we just enabled it
                    if (document.body.classList.contains('konami-mode')) {
                        alert('CHEAT CODE ACTIVATED: SUPER MODE');
                    }
                }
            } else {
                // Reset, but allow restarting the sequence if the current key is the first one
                cursor = (key === konamiCode[0]) ? 1 : 0;
                if (cursor === 1) console.log('Konami Sequence: 1/10');
            }
        });
    </script>
</body>
</html>
