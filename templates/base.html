<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ get_url(path="main.css") }}">
</head>
<body>
    <div class="stars-container">
        <div id="stars"></div>
        <div id="stars2"></div>
        <div id="stars3"></div>
    </div>

    <header>
        <nav>
            <a href="{{ get_url(path="@/_index.md") }}" class="logo">NORBU.DEV</a>
            <div class="links">
                <a href="{{ get_url(path="@/_index.md") }}">Home</a>
                <a href="https://github.com/norbu35">GitHub</a>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock content %}
    </main>

    <footer>
        <p>&copy; {{ now() | date(format="%Y") }} {{ config.extra.author | default(value="Norbu") }} • Built with Zola & Rust 🦀</p>
    </footer>

    <script>
        // Konami Code Easter Egg
        const konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
        let cursor = 0;

        document.addEventListener('keydown', (e) => {
            if (e.key === konamiCode[cursor]) {
                cursor++;
                if (cursor === konamiCode.length) {
                    document.body.classList.toggle('konami-mode');
                    cursor = 0;
                    alert('CHEAT CODE ACTIVATED: SUPER MODE');
                }
            } else {
                cursor = 0;
            }
        });
    </script>
</body>
</html>
